<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Blue Gradients for M and Chart -->
    <linearGradient id="favBlueBright" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="50%" stop-color="#00a8ff" />
      <stop offset="100%" stop-color="#0066ff" />
    </linearGradient>

    <linearGradient id="favBlueDeep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0077ff" />
      <stop offset="100%" stop-color="#003db3" />
    </linearGradient>

    <linearGradient id="favBlueDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#004cd8" />
      <stop offset="100%" stop-color="#001f66" />
    </linearGradient>

    <linearGradient id="favArrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0055ff" />
      <stop offset="50%" stop-color="#00b4d8" />
      <stop offset="100%" stop-color="#00f5ff" />
    </linearGradient>

    <linearGradient id="favBarGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0066ff" />
      <stop offset="100%" stop-color="#00d2ff" />
    </linearGradient>

    <!-- White / Silver Gradient -->
    <linearGradient id="favWhiteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
  </defs>

  <!-- Rounded Square App Tile Background -->
  <rect width="500" height="500" rx="100" fill="url(#favBg)" />

  <!-- MONOGRAM EMBLEM (SMC) Centered -->
  <g id="fav-smc" transform="translate(42, 85) scale(0.95)">
    <!-- LETTER S (White 3D) -->
    <path
      d="M 195 62 L 140 62 C 102 62 72 88 72 124 C 72 158 98 178 138 186 L 158 190 C 182 195 194 204 194 218 C 194 234 178 246 152 246 C 122 246 98 232 90 208 L 40 220 C 54 264 96 288 152 288 C 210 288 248 256 248 214 C 248 174 220 154 178 146 L 156 142 C 136 138 126 130 126 118 C 126 104 140 94 162 94 L 195 94 Z"
      fill="url(#favWhiteGrad)"
    />

    <!-- LETTER C (White 3D) -->
    <path
      d="M 378 96 C 362 74 336 62 300 62 C 236 62 190 112 190 175 C 190 238 236 288 300 288 C 342 288 372 272 390 244 L 350 216 C 338 234 322 244 300 244 C 265 244 242 214 242 175 C 242 136 265 106 300 106 C 324 106 342 118 352 136 Z"
      fill="url(#favWhiteGrad)"
    />

    <!-- THREE RISING BARS -->
    <g id="bars">
      <rect x="314" y="180" width="13" height="42" rx="3" fill="url(#favBarGrad)" />
      <rect x="333" y="152" width="13" height="70" rx="3" fill="url(#favBarGrad)" />
      <rect x="352" y="122" width="13" height="100" rx="3" fill="url(#favBarGrad)" />
    </g>

    <!-- UPWARD SWOOPING ARROW -->
    <g id="arrow">
      <path
        d="M 282 258 C 322 258 370 215 402 142 L 388 134 C 358 200 318 238 282 238 Z"
        fill="url(#favArrowGrad)"
      />
      <polygon
        points="418,122 384,136 398,154"
        fill="url(#favArrowGrad)"
      />
    </g>

    <!-- 3D FACETED ORIGAMI 'M' -->
    <g id="letter-m">
      <polygon points="172,94 220,166 186,166 150,94" fill="url(#favBlueBright)" />
      <polygon points="186,166 220,166 250,236 228,236" fill="url(#favBlueDark)" />
      <polygon points="228,236 250,236 304,64 278,64" fill="url(#favBlueBright)" />
      <polygon points="278,64 304,64 304,244 278,206" fill="url(#favBlueDeep)" />
      <polygon points="278,206 304,244 336,220 322,204" fill="url(#favBlueDark)" />
    </g>
  </g>
</svg>
