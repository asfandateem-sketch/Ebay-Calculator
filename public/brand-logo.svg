  <rect x="232" y="296" width="16" height="34" rx="3" fill="#2C3545" />

  <!-- Growth Bar 2 (Middle) -->
  <rect x="256" y="278" width="16" height="52" rx="3" fill="#2C3545" />

  <!-- Growth Bar 3 (Right, Tallest) -->
  <rect x="280" y="254" width="16" height="76" rx="3" fill="#2C3545" />

  <!-- Sweeping Growth Arrow (Blue Arc + Head) -->
  <!-- Dynamic Arc -->
