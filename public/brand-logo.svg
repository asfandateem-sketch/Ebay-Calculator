  <line x1="52" y1="472" x2="95" y2="472" stroke="#006EF5" stroke-width="2.5" stroke-linecap="round" />
  <text x="110" y="476" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="800" letter-spacing="4" fill="#2C3545">CALCULATE</text>
