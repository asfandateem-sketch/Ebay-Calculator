<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="logoBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0080ff" />
      <stop offset="100%" stop-color="#0060e6" />
    </linearGradient>
  </defs>

  <!-- Group for Circular Emblem centered at (250, 190) with radius approx 145 -->
  <g transform="translate(50, 10)">
    <!-- Dark Slate Right Arc -->
    <path
      d="M 200 32 A 168 168 0 0 1 368 200 A 168 168 0 0 1 182 367 L 182 328 A 129 129 0 0 0 329 200 A 129 129 0 0 0 200 71 Z"
      fill="#2c3545"
    />

    <!-- Main Outer Blue P Arc -->
    <path
      d="M 188 32 A 168 168 0 0 0 22 200 C 22 288 88 359 174 367 L 174 328 C 109 320 59 266 59 200 C 59 129 117 71 188 71 Z"
      fill="url(#logoBlueGrad)"
    />
    
    <!-- Blue P Upper Loop -->
    <path
      d="M 174 71 L 210 71 C 265 71 310 116 310 171 C 310 222 272 263 222 270 L 222 231 C 251 224 271 199 271 171 C 271 137 244 110 210 110 L 174 110 Z"
      fill="url(#logoBlueGrad)"
    />

    <!-- Blue P Inner Vertical Stem -->
    <path
      d="M 135 110 L 174 110 L 174 365 L 135 365 Z"
      fill="url(#logoBlueGrad)"
    />
    <path
      d="M 135 231 L 222 231 L 222 270 L 135 270 Z"
      fill="url(#logoBlueGrad)"
    />

    <!-- 3 Growth Bars -->
    <rect x="185" y="286" width="16" height="34" rx="3" fill="#2c3545" />
    <rect x="209" y="268" width="16" height="52" rx="3" fill="#2c3545" />
    <rect x="233" y="244" width="16" height="76" rx="3" fill="#2c3545" />

    <!-- Sweeping Growth Arrow -->
    <path
      d="M 184 330 C 228 326 298 276 324 205 L 312 198 C 289 260 226 305 184 310 Z"
      fill="url(#logoBlueGrad)"
    />
    <polygon
      points="338,185 306,202 322,220"
      fill="url(#logoBlueGrad)"
    />
  </g>

  <!-- Typography: ProfitEbay -->
  <text x="52" y="438" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="74" font-weight="900" letter-spacing="-2" fill="#252f3f">Profit</text>
  <text x="256" y="438" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="74" font-weight="900" letter-spacing="-2" fill="#006ef5">Ebay</text>

  <!-- Subtitle Tagline: CALCULATE • ANALYZE • PROFIT -->
  <line x1="52" y1="472" x2="98" y2="472" stroke="#006ef5" stroke-width="2.5" stroke-linecap="round" />
  <text x="112" y="476" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" letter-spacing="3.5" fill="#2c3545">CALCULATE</text>
  <circle cx="230" cy="471" r="3.5" fill="#006ef5" />
  <text x="248" y="476" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" letter-spacing="3.5" fill="#2c3545">ANALYZE</text>
  <circle cx="346" cy="471" r="3.5" fill="#006ef5" />
  <text x="364" y="476" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="800" letter-spacing="3.5" fill="#2c3545">PROFIT</text>
  <line x1="448" y1="472" x2="494" y2="472" stroke="#006ef5" stroke-width="2.5" stroke-linecap="round" />
</svg>
